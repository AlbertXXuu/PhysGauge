[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physgauge"
version = "1.1.2"
description = "Deterministic stress tests for physics-aware video evaluation metrics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "AlbertXXuu" }]
keywords = [
  "world-model",
  "video-evaluation",
  "physics",
  "benchmark",
  "reproducibility",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
physgauge = "physgauge.cli:main"

[project.urls]
Homepage = "https://alvenx.com"
Repository = "https://github.com/AlbertXXuu/PhysGauge"
Issues = "https://github.com/AlbertXXuu/PhysGauge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physgauge = [
  "assets/brand/*.svg",
  "assets/evidence/*.json",
  "assets/fonts/*.woff2",
  "assets/fonts/*.txt",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
